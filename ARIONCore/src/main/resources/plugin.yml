name: ARIONCore
version: '${version}'
main: id.arion.core.ARIONCorePlugin
api-version: '1.21.11'
description: ARION season foundation, persistent DeathBan and Genesis opening event
authors: [ARION]
softdepend: [Factions, WorldGuard]
commands:
  arion:
    description: ARIONCore administration
    usage: /arion <help|status|deathban|faction|genesis>
    permission: arion.admin
permissions:
  arion.admin.genesis:
    description: Prepare, start and recover the Genesis opening event (also requires arion.admin)
    default: op
  arion.admin:
    description: Inspect ARIONCore and manage DeathBans
    default: op
  arion.deathban.bypass:
    description: Exempt future deaths from DeathBan (does not clear existing bans)
    default: false
